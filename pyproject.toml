[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "massivemagnetics-ip"
version = "0.1.0"
description = "Tamper-evident invention provenance, evidence custody, and publication-control tooling."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Brandon Emery / Massive Magnetics" }]
license = { text = "Proprietary - see LEGAL-NOTICE.md" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: Other/Proprietary License",
]

[project.scripts]
mmip = "mmip.cli:main"

[tool.setuptools]
packages = ["mmip"]

